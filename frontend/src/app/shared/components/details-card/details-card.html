<div class="card">
  <img class="card__poster" [src]="movieDetails().Poster" alt="###" />
  <div class="card__description">
    <h1>{{ movieDetails().Title }} ({{ movieDetails().Year }})</h1>
    <p class="card__description-plot">{{ movieDetails().Plot }}</p>
    <p class="card__description-rating">
      <img src="assets/star.svg" alt="" />
      IMDB Rating: {{ movieDetails().imdbRating }}
    </p>
    <app-personal-comment />
  </div>
</div>

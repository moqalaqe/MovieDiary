<div class="card">
  <div class="card__left">
    <img [src]="movieDetails().Poster" alt="###" />
  </div>
  <div class="card__right">
    <h2>{{ movieDetails().Title }}</h2>
    <p>{{ movieDetails().Plot }}</p>
    <div>
      <p>Personal Comments</p>
      <textarea rows="6" placeholder="Write your comments here"></textarea>
    </div>
  </div>
</div>

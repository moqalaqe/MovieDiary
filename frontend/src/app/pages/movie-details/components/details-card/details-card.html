<div class="card">
  <img class="card__poster" [src]="movieDetails().Poster" alt="###" />

  <div class="card__description">
    <h1>{{ movieDetails().Title }} ({{ movieDetails().Year }})</h1>
    <p class="card__description-plot">{{ movieDetails().Plot }}</p>

    <app-save-details
      [imdbRating]="movieDetails().imdbRating"
      (detailsChange)="onDetailsChange($event)"
    />
    <app-personal-comment (save)="onSave($event)" />
  </div>
</div>
